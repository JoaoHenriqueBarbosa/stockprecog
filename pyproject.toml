[project]
name = "stockprecog"
version = "0.1.0"
description = "Cross-sectional P(trade succeeds) model on B3 (IBrX universe), López de Prado pipeline, GPU-first frontier path"
readme = "README.md"
authors = [
    { name = "JoaoHenriqueBarbosa", email = "joaohenriquebarbosa21@gmail.com" }
]
requires-python = "~=3.12.0"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "yfinance>=0.2.51",
    "matplotlib>=3.9",
    "torch>=2.12",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

# --- GPU-first: pin torch to the CUDA 13.0 wheel index (matches driver CUDA 13.2, Blackwell sm_120) ---
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
